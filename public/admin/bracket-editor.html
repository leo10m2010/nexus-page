<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bracket — Panel de administración</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter+Tight:wght@400;500;600&display=swap" />
<style>
  :root {
    --c-bg: #06080f;
    --c-bg-elev: #0b1020;
    --c-bg-elev-2: #101830;
    --c-line: rgb(238 237 238 / 0.10);
    --c-line-strong: rgb(238 237 238 / 0.20);
    --c-text: #eeedee;
    --c-text-muted: #9aa3b8;
    --c-accent: #ae7c32;
    --c-accent-lift: #d2a355;
    --font-display: "Archivo", ui-sans-serif, system-ui, sans-serif;
    --radius-control: 0.5rem;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--c-bg);
    color: var(--c-text);
    font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    padding: 1.5rem;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
  }
  .back-link {
    color: var(--c-text-muted);
    text-decoration: underline;
    font-size: 0.875rem;
  }
  .back-link:hover { color: var(--c-text); }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.75rem, 3.4vw, 2.75rem);
    margin: 0 0 0.5rem;
    text-transform: uppercase;
  }
  .hint {
    color: var(--c-text-muted);
    font-size: 0.875rem;
    margin: 0 0 2rem;
  }
  .status {
    color: var(--c-text-muted);
    font-size: 0.9375rem;
  }
  .status.error { color: #f87171; }

  h3.side-heading {
    margin: 0 0 1.25rem;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.9375rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--c-accent-lift);
  }
  .side-block { margin-bottom: 3rem; }
  .bracket-scroll { overflow-x: auto; padding-bottom: 0.5rem; }
  .bracket { display: flex; align-items: stretch; gap: 2.5rem; min-width: max-content; }
  .bracket-round { display: flex; width: 15.5rem; flex-direction: column; }
  .bracket-head {
    margin: 0 0 1rem;
    font-family: var(--font-display);
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--c-text-muted);
  }
  .bracket-body { display: flex; flex: 1; flex-direction: column; }
  .bracket-pair {
    position: relative;
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: space-around;
  }
  .bracket-match {
    position: relative;
    display: block;
    margin-block: 0.4375rem;
    border: 1px solid var(--c-line-strong);
    border-radius: var(--radius-control);
    background: var(--c-bg-elev);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease;
  }
  .bracket-match:hover { border-color: var(--c-accent); }
  .bracket-meta {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    border-bottom: 1px solid var(--c-line);
    padding: 0.375rem 0.625rem;
    font-size: 0.625rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--c-text-muted);
  }
  .bracket-seat {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-left: 2px solid transparent;
    padding: 0.4375rem 0.625rem;
    font-size: 0.8125rem;
    color: var(--c-text-muted);
  }
  .bracket-seat + .bracket-seat { border-top: 1px solid var(--c-line); }
  .bracket-seat.is-winner { border-left-color: var(--c-accent); color: var(--c-text); }
  .bracket-score { margin-left: auto; font-variant-numeric: tabular-nums; }
  .is-winner .bracket-score { color: var(--c-accent-lift); }
  .seat-mark {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 0.25rem;
    object-fit: contain;
    background-color: var(--c-bg-elev-2);
  }
  .seat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .is-feeding .bracket-match::after,
  .is-feeding .bracket-pair::after,
  .is-feeding .bracket-pair.is-pair::before {
    content: "";
    position: absolute;
    background: var(--c-line-strong);
  }
  .is-feeding .bracket-match::after { top: 50%; left: 100%; height: 1px; width: 1.25rem; }
  .is-feeding .bracket-pair.is-pair::before { top: 25%; left: calc(100% + 1.25rem); height: 50%; width: 1px; }
  .is-feeding .bracket-pair::after { top: 50%; left: calc(100% + 1.25rem); height: 1px; width: 1.25rem; }
</style>
</head>
<body>
  <div class="top-bar">
    <a class="back-link" href="/admin/index.html#/collections/brackets">← Volver al panel</a>
  </div>
  <h1>Bracket</h1>
  <p class="hint">Haz clic en cualquier cruce para editarlo.</p>
  <div id="content"><p class="status">Cargando…</p></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>
    var STAGE_LABELS = {
      groupStage: "Fase de grupos",
      lowerRound: "Cuadro inferior",
      quarterfinal: "Cuartos de final",
      semifinal: "Semifinal",
      upperFinal: "Final del cuadro superior",
      lowerFinal: "Final del cuadro inferior",
      final: "Final",
      grandFinal: "Gran final",
      thirdPlace: "Tercer puesto",
    };
    var NAMED_STAGES = new Set([
      "quarterfinal", "semifinal", "upperFinal", "lowerFinal", "final", "grandFinal", "thirdPlace",
    ]);
    var SIDE_LABELS = { upper: "Cuadro superior", lower: "Cuadro inferior", final: "Gran final" };
    var SIDES = ["upper", "lower", "final"];

    function h(tag, attrs, children) {
      var el = document.createElement(tag);
      for (var k in attrs || {}) {
        if (k === "className") el.className = attrs[k];
        else if (k === "href") el.setAttribute("href", attrs[k]);
        else el.setAttribute(k, attrs[k]);
      }
      (children || []).forEach(function (c) {
        if (c == null) return;
        el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return el;
    }

    function formatDate(iso) {
      if (!iso) return "Fecha por definir";
      var d = new Date(iso);
      if (isNaN(d.getTime())) return "Fecha por definir";
      return new Intl.DateTimeFormat("es-PE", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })
        .format(d)
        .toUpperCase();
    }

    async function fetchYamlFolder(repo, branch, folder) {
      var res = await fetch("https://api.github.com/repos/" + repo + "/contents/" + folder + "?ref=" + branch);
      if (!res.ok) throw new Error("No se pudo listar " + folder + " (" + res.status + ")");
      var files = await res.json();
      var docs = await Promise.all(
        files
          .filter(function (f) { return f.name.endsWith(".yaml"); })
          .map(async function (f) {
            var raw = await fetch(f.download_url);
            return jsyaml.load(await raw.text());
          })
      );
      return docs;
    }

    function winner(match, seat) {
      if (!match.score) return false;
      var home = match.score[0], away = match.score[1];
      return seat === "home" ? home > away : away > home;
    }

    function pairs(matches) {
      var out = [];
      matches.forEach(function (m, i) {
        if (i % 2 === 0) out.push([m]);
        else out[out.length - 1].push(m);
      });
      return out;
    }

    function feeds(round, next) {
      return next != null && next.matches.length * 2 === round.matches.length;
    }

    function heading(round) {
      return round.stage ? STAGE_LABELS[round.stage] : "Ronda " + round.round;
    }

    function repeatsSide(side, round, sidesCount) {
      return sidesCount > 1 && side.rounds.length === 1 && heading(round) === SIDE_LABELS[side.side];
    }

    function seatNode(match, seat, teamById) {
      var id = match[seat];
      var team = id ? teamById[id] : null;
      var isWinner = winner(match, seat);
      var mark = team && team.logo
        ? h("img", { className: "seat-mark", src: team.logo, alt: "" })
        : h("span", { className: "seat-mark" });
      var score = match.score ? String(match.score[seat === "home" ? 0 : 1]) : "-";
      return h("div", { className: "bracket-seat" + (isWinner ? " is-winner" : "") }, [
        mark,
        h("span", { className: "seat-name" }, [team ? team.name : "Por definir"]),
        h("span", { className: "bracket-score" }, [score]),
      ]);
    }

    function matchNode(match, teamById) {
      var link = h("a", { className: "bracket-match", href: "/admin/index.html#/collections/brackets/entries/" + match.id }, [
        h("p", { className: "bracket-meta" }, [
          h("span", {}, [formatDate(match.startsAt)]),
          match.bestOf ? h("span", {}, ["BO" + match.bestOf]) : null,
        ]),
        seatNode(match, "home", teamById),
        seatNode(match, "away", teamById),
      ]);
      return link;
    }

    function buildBracket(matches, teamById) {
      var inBracket = matches.filter(function (m) { return m.bracket && m.round; });

      var sides = SIDES.map(function (side) {
        var roundsMap = {};
        inBracket.filter(function (m) { return m.bracket === side; }).forEach(function (m) {
          (roundsMap[m.round] = roundsMap[m.round] || []).push(m);
        });
        var rounds = Object.keys(roundsMap)
          .map(Number)
          .sort(function (a, b) { return a - b; })
          .map(function (roundNum) {
            var ms = roundsMap[roundNum];
            var sameStage = ms.every(function (m) { return m.stage === ms[0].stage; });
            return {
              round: roundNum,
              stage: sameStage && NAMED_STAGES.has(ms[0].stage) ? ms[0].stage : null,
              matches: ms,
            };
          });
        return { side: side, rounds: rounds };
      }).filter(function (s) { return s.rounds.length > 0; });

      var container = h("div", {}, []);
      sides.forEach(function (side) {
        var block = h("div", { className: "side-block" }, []);
        if (sides.length > 1) {
          block.appendChild(h("h3", { className: "side-heading" }, [SIDE_LABELS[side.side]]));
        }
        var scroll = h("div", { className: "bracket-scroll" }, []);
        var bracket = h("div", { className: "bracket" }, []);
        side.rounds.forEach(function (round, r) {
          var isFeeding = feeds(round, side.rounds[r + 1]);
          var roundEl = h("div", { className: "bracket-round" + (isFeeding ? " is-feeding" : "") }, []);
          if (!repeatsSide(side, round, sides.length)) {
            roundEl.appendChild(h("h4", { className: "bracket-head" }, [heading(round)]));
          }
          var body = h("div", { className: "bracket-body" }, []);
          pairs(round.matches).forEach(function (pair) {
            var pairEl = h("div", { className: "bracket-pair" + (pair.length === 2 ? " is-pair" : "") }, []);
            pair.forEach(function (m) { pairEl.appendChild(matchNode(m, teamById)); });
            body.appendChild(pairEl);
          });
          roundEl.appendChild(body);
          bracket.appendChild(roundEl);
        });
        scroll.appendChild(bracket);
        block.appendChild(scroll);
        container.appendChild(block);
      });
      return container;
    }

    (async function init() {
      var content = document.getElementById("content");
      try {
        var configRes = await fetch("/admin/config.yml");
        var config = jsyaml.load(await configRes.text());
        var repo = config.backend.repo;
        var branch = config.backend.branch || "main";

        var teamDocs = await fetchYamlFolder(repo, branch, "src/data/teams");
        var matchDocs = await fetchYamlFolder(repo, branch, "src/data/matches");

        var teamById = {};
        teamDocs.forEach(function (t) { teamById[t.id] = t; });

        content.innerHTML = "";
        content.appendChild(buildBracket(matchDocs, teamById));
      } catch (err) {
        content.innerHTML = "";
        content.appendChild(h("p", { className: "status error" }, [
          "No se pudo cargar el bracket: " + err.message,
        ]));
      }
    })();
  </script>
</body>
</html>
