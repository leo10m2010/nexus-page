        hint: "No lo cambies después de guardar por primera vez."

  - name: "torneos"
    label: "Torneos"
    label_singular: "Torneo"
    folder: "src/data/tournaments"
    extension: "yaml"
    format: "yaml"
    create: true
    delete: true
    slug: "{{fields.id}}"
    identifier_field: "name"
    summary: "{{name}} — {{status}}"
    sortable_fields: ["name"]
    fields:
      - label: "Nombre"
        name: "name"
        widget: "string"
      - label: "Estado"
        name: "status"
        widget: "select"
        options:
          - { label: "Próximo", value: "upcoming" }
          - { label: "En vivo", value: "live" }
          - { label: "Finalizado", value: "finished" }
      - label: "Fecha de inicio"
        name: "startDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Fecha de fin"
        name: "endDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Región"
        name: "region"
        widget: "string"
      - label: "Formato"
        name: "format"
        widget: "select"
        options:
          - { label: "Doble eliminación", value: "doubleElimination" }
          - { label: "Eliminación simple", value: "singleElimination" }
          - { label: "Round robin", value: "roundRobin" }
          - { label: "Suizo", value: "swiss" }
      - label: "Cantidad de equipos"
        name: "teamCount"
        widget: "number"
        value_type: "int"
      - label: "Organizador"
        name: "organizer"
        widget: "string"
        required: false
      - label: "Modalidad"
        name: "venue"
        widget: "select"
        required: false
        options:
          - { label: "Online", value: "online" }
          - { label: "Presencial", value: "offline" }
          - { label: "Híbrido", value: "hybrid" }
      - label: "Ubicación (si es presencial)"
        name: "location"
        widget: "string"
        required: false
      - label: "Serie / temporada"
        name: "series"
        widget: "string"
        required: false
      - label: "Premios"
        name: "prizePool"
        widget: "object"
        required: false
        collapsed: true
        summary: "{{fields.currency}} {{fields.total}}"
        fields:
          - { label: "Moneda (3 letras, ej: USD)", name: "currency", widget: "string" }
          - { label: "Total", name: "total", widget: "number" }
          - label: "Distribución de premios"
            name: "distribution"
            widget: "list"
            required: false
            collapsed: true
            summary: "Puesto {{fields.place}} — {{fields.amount}}"
            fields:
              - { label: "Puesto", name: "place", widget: "number", value_type: "int" }
              - { label: "Hasta el puesto (para rangos, ej 5º-8º)", name: "to", widget: "number", value_type: "int", required: false }
              - { label: "Monto", name: "amount", widget: "number" }
              - label: "Equipo ganador (si ya se sabe)"
                name: "team"
                widget: "relation"
                collection: "equipos"
                search_fields: ["name"]
                value_field: "id"
                display_fields: ["name"]
                required: false
      - label: "Fases"
        name: "phases"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.key}}"
        fields:
          - label: "Etapa"
            name: "key"
            widget: "select"
            options:
              - { label: "Clasificatoria", value: "qualifier" }
              - { label: "Fase de grupos", value: "groupStage" }
              - { label: "Fase suiza", value: "swissStage" }
              - { label: "Playoffs", value: "playoffs" }
              - { label: "Finales", value: "finals" }
          - label: "Formato"
            name: "format"
            widget: "select"
            options:
              - { label: "Doble eliminación", value: "doubleElimination" }
              - { label: "Eliminación simple", value: "singleElimination" }
              - { label: "Round robin", value: "roundRobin" }
              - { label: "Suizo", value: "swiss" }
          - { label: "Cantidad de equipos", name: "teamCount", widget: "number", value_type: "int", required: false }
          - { label: "Mejor de (Bo)", name: "bestOf", widget: "number", value_type: "int", required: false }
          - { label: "Avanzan", name: "advance", widget: "number", value_type: "int", required: false }
      - label: "Participantes"
        name: "participants"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.team}}"
        fields:
          - label: "Equipo"
            name: "team"
            widget: "relation"
            collection: "equipos"
            search_fields: ["name"]
            value_field: "id"
            display_fields: ["name"]
          - label: "Vía de clasificación"
            name: "via"
            widget: "select"
            required: false
            options:
              - { label: "Invitado", value: "invited" }
              - { label: "Clasificatoria", value: "qualifier" }
              - { label: "Regional", value: "regional" }
              - { label: "Defensor del título", value: "defending" }
      - label: "Talento de transmisión"
        name: "broadcastTalent"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.name}}"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Rol", name: "role", widget: "string" }
          - { label: "Icono (identificador de simple-icons, ej: simple-icons:kick)", name: "icon", widget: "string" }
          - { label: "URL del canal", name: "href", widget: "string" }
      - label: "ID interno"
        name: "id"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones, ej: season-one"]
        hint: "No lo cambies después de guardar por primera vez. También forma parte de la URL del torneo."

  - name: "partidos"
    label: "Partidos"
    label_singular: "Partido"
    folder: "src/data/matches"
    extension: "yaml"
    format: "yaml"
    create: true
    delete: true
    filter: { field: "phase", value: "groupStage" }
    slug: "{{fields.id}}"
    identifier_field: "id"
    summary: "{{fields.home}} vs {{fields.away}} — Grupo {{fields.group}} · {{fields.startsAt | date('D MMM, HH:mm')}}"
    sortable_fields: ["id"]
    fields:
      - { label: "Fase (no tocar)", name: "phase", widget: "hidden", default: "groupStage" }
      - { label: "Etapa (no tocar)", name: "stage", widget: "hidden", default: "groupStage" }
      - label: "Torneo"
        name: "tournament"
        widget: "relation"
        collection: "torneos"
        search_fields: ["name"]
        value_field: "id"
        display_fields: ["name"]
      - label: "Grupo"
        name: "group"
        widget: "string"
      - label: "Fecha y hora (en UTC)"
        name: "startsAt"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss[Z]"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        picker_utc: true
      - label: "Equipo local"
        name: "home"
        widget: "relation"
        collection: "equipos"
        search_fields: ["name"]
        value_field: "id"
        display_fields: ["name"]
        required: false
      - label: "Equipo visitante"
        name: "away"
        widget: "relation"
        collection: "equipos"
        search_fields: ["name"]
        value_field: "id"
        display_fields: ["name"]
        required: false
      - label: "Marcador (mapas ganados: local, visitante)"
        name: "score"
        widget: "list"
        required: false
        min: 2
        max: 2
        field: { label: "Mapas", name: "maps", widget: "number", value_type: "int" }
      - label: "Mejor de (Bo)"
        name: "bestOf"
        widget: "number"
        value_type: "int"
        required: false
      - label: "ID interno"
        name: "id"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones"]
        hint: "No lo cambies después de guardar por primera vez."

  - name: "brackets"
    label: "Brackets"
    label_singular: "Cruce"
    folder: "src/data/matches"
    extension: "yaml"
    format: "yaml"
    create: true
    delete: true
    filter: { field: "phase", value: "bracket" }
    slug: "{{fields.id}}"
    identifier_field: "id"
    summary: "{{fields.home}} vs {{fields.away}} — {{fields.stage}} · {{fields.startsAt | date('D MMM, HH:mm')}}"
    sortable_fields: ["id"]
    fields:
      - { label: "Fase (no tocar)", name: "phase", widget: "hidden", default: "bracket" }
      - label: "Torneo"
        name: "tournament"
        widget: "relation"
        collection: "torneos"
        search_fields: ["name"]
        value_field: "id"
        display_fields: ["name"]
      - label: "Etapa"
        name: "stage"
        widget: "select"
        options:
          - { label: "Ronda inferior", value: "lowerRound" }
          - { label: "Cuartos de final", value: "quarterfinal" }
          - { label: "Semifinal", value: "semifinal" }
          - { label: "Final del bracket superior", value: "upperFinal" }
          - { label: "Final del bracket inferior", value: "lowerFinal" }
          - { label: "Final", value: "final" }
          - { label: "Gran final", value: "grandFinal" }
          - { label: "Tercer puesto", value: "thirdPlace" }
      - label: "Bracket"
        name: "bracket"
        widget: "select"
        required: false
        options:
          - { label: "Superior", value: "upper" }
          - { label: "Inferior", value: "lower" }
          - { label: "Final", value: "final" }
      - label: "Ronda"
        name: "round"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Fecha y hora (en UTC)"
        name: "startsAt"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss[Z]"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        picker_utc: true
      - label: "Equipo local"
        name: "home"
        widget: "relation"
        collection: "equipos"
        search_fields: ["name"]
        value_field: "id"
        display_fields: ["name"]
        required: false
        hint: "Déjalo vacío hasta que se sepa quién avanza a este cruce."
      - label: "Equipo visitante"
        name: "away"
        widget: "relation"
        collection: "equipos"
        search_fields: ["name"]
        value_field: "id"
        display_fields: ["name"]
        required: false
        hint: "Déjalo vacío hasta que se sepa quién avanza a este cruce."
      - label: "Marcador (mapas ganados: local, visitante)"
        name: "score"
        widget: "list"
        required: false
        min: 2
        max: 2
        field: { label: "Mapas", name: "maps", widget: "number", value_type: "int" }
        hint: "Al completar el marcador, la vista previa marca automáticamente quién avanza."
      - label: "Mejor de (Bo)"
        name: "bestOf"
        widget: "number"
        value_type: "int"
        required: false
      - label: "ID interno"
        name: "id"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones"]
        hint: "No lo cambies después de guardar por primera vez."
