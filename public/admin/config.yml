backend:
  name: github
  repo: leo10m2010/nexus-page
  branch: main
  base_url: https://nexusseries.org
  auth_endpoint: api/auth

local_backend: true

publish_mode: simple

logo_url: "/logos/white.svg"
site_url: "https://nexusseries.org"

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "es"

collections:
  - name: "sponsors"
    label: "Sponsors"
    files:
      - name: "homepage"
        label: "Sponsors de portada"
        file: "src/data/sponsors/homepage.yaml"
        fields:
          - label: "Sponsors"
            name: "sponsors"
            widget: "list"
            required: false
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.name}} · {{fields.tier}}"
            hint: "Arrastra los elementos para cambiar el orden en la portada. Puedes ocultar una marca sin borrarla."
            fields:
              - { label: "Nombre de la marca", name: "name", widget: "string" }
              - label: "Logo"
                name: "logo"
                widget: "image"
                choose_url: false
                media_folder: "/public/sponsors"
                public_folder: "/sponsors"
                hint: "Preferiblemente SVG o PNG/WebP transparente, con espacio alrededor del símbolo."
              - label: "Sitio web"
                name: "url"
                widget: "string"
                required: false
                pattern: ["^https://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[^\\s]*)?$", "Usa una URL HTTPS completa y sin espacios."]
              - label: "Nivel de presencia"
                name: "tier"
                widget: "select"
                default: "official"
                options:
                  - { label: "Sponsor principal (acento destacado)", value: "principal" }
                  - { label: "Sponsor oficial", value: "official" }
                  - { label: "Colaborador", value: "collaborator" }
              - label: "Fondo para el logo"
                name: "surface"
                widget: "select"
                default: "auto"
                hint: "Usa claro para logos oscuros y oscuro para logos blancos."
                options:
                  - { label: "Automático (tema de la web)", value: "auto" }
                  - { label: "Claro", value: "light" }
                  - { label: "Oscuro", value: "dark" }
              - label: "Visible en la web"
                name: "active"
                widget: "boolean"
                default: true

  - name: "ajustes"
    label: "Ajustes globales"
    files:
      - name: "canales"
        label: "Canales en vivo"
        file: "src/data/settings/channels.json"
        fields:
          - label: "Canales oficiales"
            name: "channels"
            widget: "list"
            min: 1
            max: 3
            collapsed: false
            summary: "{{fields.code}} · {{fields.href}}"
            hint: "El idioma determina automáticamente la bandera que aparece en la web."
            fields:
              - label: "Idioma"
                name: "code"
                widget: "select"
                options:
                  - { label: "Español", value: "ES" }
                  - { label: "Inglés", value: "EN" }
                  - { label: "Ruso", value: "RU" }
              - label: "URL de Twitch"
                name: "href"
                widget: "string"
                pattern: ["^https://(?:www\\.)?twitch\\.tv/[A-Za-z0-9_]+/?$", "Usa una URL completa de Twitch."]

  - name: "equipos"
    label: "Equipos"
    label_singular: "Equipo"
    folder: "src/data/teams"
    extension: "yaml"
    format: "yaml"
    create: true
    delete: false
    slug: "{{fields.id}}"
    identifier_field: "name"
    summary: "{{name}} ({{tag}})"
    sortable_fields: ["name"]
    fields:
      - label: "Importar desde Liquipedia"
        name: "liquipediaUrl"
        widget: "liquipedia_team"
        required: false
        hint: "Busca por nombre o pega la página de Liquipedia. Podrás comparar los cambios antes de aplicarlos."
      - label: "Nombre"
        name: "name"
        widget: "string"
      - label: "Tag (2 a 4 letras)"
        name: "tag"
        widget: "string"
        pattern: ["^.{2,4}$", "Entre 2 y 4 caracteres"]
      - label: "País del equipo (ISO, opcional)"
        name: "country"
        widget: "string"
        required: false
        pattern: ["^[A-Z]{2}$", "Usa dos letras mayúsculas, por ejemplo PE"]
      - label: "Región"
        name: "region"
        widget: "string"
        required: false
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: false
        media_folder: "/public/teams"
        public_folder: "/teams"
        hint: "Usa una imagen cuadrada, liviana y con fondo transparente."
      - label: "Jugadores"
        name: "players"
        widget: "list"
        required: false
        summary: "{{fields.handle}}"
        fields:
          - label: "Handle (nombre en juego)"
            name: "handle"
            widget: "string"
          - label: "País"
            name: "country"
            widget: "select"
            required: false
