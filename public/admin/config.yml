  - name: "torneos"
    label: "Torneos"
    label_singular: "Torneo"
    folder: "src/data/tournaments"
    extension: "yaml"
    format: "yaml"
    create: true
    delete: false
    slug: "{{fields.id}}"
    identifier_field: "name"
    summary: "{{name}} — {{status}}"
    sortable_fields: ["name"]
    fields:
      - label: "Nombre"
        name: "name"
        widget: "string"
      - label: "Estado"
        name: "status"
        widget: "select"
        options:
          - { label: "Próximo", value: "upcoming" }
          - { label: "En vivo", value: "live" }
          - { label: "Finalizado", value: "finished" }
      - label: "Fecha de inicio"
        name: "startDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Fecha de fin"
        name: "endDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Región"
        name: "region"
        widget: "string"
      - label: "Modalidad"
        name: "venue"
        widget: "select"
        default: "online"
        options:
          - { label: "Online", value: "online" }
          - { label: "Presencial", value: "offline" }
          - { label: "Híbrido", value: "hybrid" }
      - label: "Ubicación (si es presencial)"
        name: "location"
        widget: "string"
        required: false
        hint: "Déjalo vacío para torneos online."
      - label: "Logo del roadmap"
        name: "roadmapIcon"
        widget: "image"
        required: false
        media_folder: "/public/seasons"
        public_folder: "/seasons"
        hint: "Opcional. Si lo dejas vacío, la web usa el número romano de la edición."
      - label: "Color de la edición"
        name: "roadmapColor"
        widget: "color"
        required: false
        allowInput: true
        hint: "Identifica la edición en la línea y la tarjeta del roadmap."
      - label: "Página en Liquipedia"
        name: "liquipediaUrl"
        widget: "string"
        required: false
        pattern: ["^https://liquipedia\\.net/.+", "Usa una URL completa de Liquipedia."]
        hint: "Enlace público al torneo en Liquipedia."
      - label: "Participantes"
        name: "participants"
        widget: "list"
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.team}}"
        fields:
          - label: "Equipo"
            name: "team"
            widget: "relation"
            collection: "equipos"
            search_fields: ["name", "tag"]
            value_field: "id"
            display_fields: ["name", "tag"]
          - label: "Vía de clasificación"
            name: "via"
            widget: "select"
            required: false
            options:
              - { label: "Invitado", value: "invited" }
              - { label: "Clasificatoria", value: "qualifier" }
              - { label: "Regional", value: "regional" }
              - { label: "Defensor del título", value: "defending" }
      - label: "Premios"
        name: "prizePool"
        widget: "object"
        required: false
        collapsed: true
        summary: "{{fields.currency}} · Distribución"
        fields:
          - { label: "Moneda (3 letras, ej: USD)", name: "currency", widget: "string", pattern: ["^[A-Z]{3}$", "Usa tres letras mayúsculas, por ejemplo USD"] }
          - label: "Distribución de premios"
            name: "distribution"
            widget: "list"
            collapsed: true
            minimize_collapsed: true
            summary: "Puesto {{fields.place}} — {{fields.amount}}"
            fields:
              - { label: "Puesto", name: "place", widget: "number", value_type: "int", min: 1 }
              - { label: "Hasta el puesto (para rangos, ej 5º-8º)", name: "to", widget: "number", value_type: "int", min: 1, required: false }
              - { label: "Monto", name: "amount", widget: "number", min: 0 }
      - label: "Fases"
        name: "phases"
        widget: "list"
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.key}}"
        fields:
          - label: "Etapa"
            name: "key"
            widget: "select"
            options:
              - { label: "Fase de grupos", value: "groupStage" }
              - { label: "Playoffs", value: "playoffs" }
              - { label: "Finales", value: "finals" }
          - label: "Formato"
            name: "format"
            widget: "select"
            options:
              - { label: "Doble eliminación", value: "doubleElimination" }
              - { label: "Eliminación simple", value: "singleElimination" }
              - { label: "Round robin", value: "roundRobin" }
          - { label: "Cantidad de equipos", name: "teamCount", widget: "number", value_type: "int", min: 1, required: false }
          - { label: "Mejor de (Bo)", name: "bestOf", widget: "number", value_type: "int", min: 1, step: 2, required: false }
          - { label: "Avanzan", name: "advance", widget: "number", value_type: "int", min: 1, required: false }
      - label: "Talento de transmisión"
        name: "broadcastTalent"
        widget: "list"
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.name}}"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - label: "Idioma"
            name: "language"
            widget: "select"
            options:
              - { label: "Español", value: "es" }
              - { label: "Inglés", value: "en" }
              - { label: "Ruso", value: "ru" }
          - label: "Plataforma"
            name: "icon"
            widget: "select"
            options:
              - { label: "Kick", value: "simple-icons:kick" }
              - { label: "Twitch", value: "simple-icons:twitch" }
              - { label: "YouTube", value: "simple-icons:youtube" }
          - { label: "URL del canal", name: "href", widget: "string", pattern: ["^https://.+", "Usa una URL completa que empiece por https://"] }
      - label: "ID interno"
        name: "id"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones, ej: season-one"]
        hint: "No lo cambies después de guardar por primera vez. También forma parte de la URL del torneo."

  - name: "partidos"
    label: "Jornada"
    label_singular: "Partido"
    folder: "src/data/matches"
    extension: "yaml"
    format: "yaml"
    create: true
    delete: true
    filter: { field: "phase", value: "groupStage" }
    slug: "{{fields.id}}"
    identifier_field: "id"
    summary: "{{fields.startsAt}} · Grupo {{fields.group}} · {{fields.home}} vs {{fields.away}}"
    sortable_fields: ["startsAt", "tournament", "group"]
    fields:
      - { label: "Tipo", name: "phase", widget: "hidden", default: "groupStage" }
      - { label: "Etapa", name: "stage", widget: "hidden", default: "groupStage" }
      - label: "Torneo"
        name: "tournament"
        widget: "relation"
        collection: "torneos"
        search_fields: ["name"]
        value_field: "id"
        display_fields: ["name"]
      - label: "Grupo"
        name: "group"
        widget: "string"
      - label: "Fecha y hora (Perú)"
        name: "startsAt"
        widget: "peru_datetime"
        format: "YYYY-MM-DDTHH:mm:ss[Z]"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        hint: "Hora de Lima (PET, UTC-5). El valor se guarda en UTC automáticamente."
      - label: "Equipo local"
        name: "home"
        widget: "relation"
        collection: "equipos"
        search_fields: ["name", "tag"]
        value_field: "id"
        display_fields: ["name", "tag"]
        required: false
      - label: "Equipo visitante"
        name: "away"
        widget: "relation"
        collection: "equipos"
        search_fields: ["name", "tag"]
        value_field: "id"
        display_fields: ["name", "tag"]
        required: false
      - label: "Resultado"
        name: "score"
        widget: "object"
        required: false
        collapsed: true
        summary: "{{fields.home}} - {{fields.away}}"
        fields:
          - { label: "Mapas del equipo local", name: "home", widget: "number", value_type: "int", min: 0 }
          - { label: "Mapas del equipo visitante", name: "away", widget: "number", value_type: "int", min: 0 }
      - label: "Mejor de (solo si cambia)"
        name: "bestOf"
        widget: "number"
        value_type: "int"
        min: 1
        step: 2
        required: false
        hint: "Se hereda de la fase del torneo. Completa este campo solo para una excepción."
      - label: "ID interno"
        name: "id"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones"]
        hint: "No lo cambies después de guardar por primera vez."

  - name: "brackets"
    label: "Eliminatorias"
    label_singular: "Bracket"
    folder: "src/data/brackets"
    extension: "yaml"
    format: "yaml"
    create: false
    delete: false
    slug: "{{fields.id}}"
    identifier_field: "tournament"
    summary: "{{tournament}} · Bracket completo"
    sortable_fields: ["tournament"]
    fields:
      - { label: "Torneo", name: "tournament", widget: "hidden" }
      - { label: "Mejor de predeterminado", name: "defaultBestOf", widget: "hidden", default: 3 }
      - label: "Cuadro completo"
        name: "matches"
        widget: "bracket_editor"
        hint: "Edita aquí todo el bracket. Los ganadores y perdedores avanzan automáticamente."
        fields:
          - { label: "ID", name: "id", widget: "string" }
          - label: "Etapa"
            name: "stage"
            widget: "select"
            options: ["lowerRound", "quarterfinal", "semifinal", "upperFinal", "lowerFinal", "final", "grandFinal", "thirdPlace"]
          - { label: "Fecha", name: "startsAt", widget: "datetime" }
          - { label: "Equipo local", name: "home", widget: "string", required: false }
          - { label: "Equipo visitante", name: "away", widget: "string", required: false }
          - label: "Origen local"
            name: "homeSource"
            widget: "object"
            required: false
            fields:
              - { label: "Cruce", name: "match", widget: "string" }
              - { label: "Resultado", name: "outcome", widget: "select", options: ["winner", "loser"] }
          - label: "Origen visitante"
            name: "awaySource"
            widget: "object"
            required: false
            fields:
              - { label: "Cruce", name: "match", widget: "string" }
              - { label: "Resultado", name: "outcome", widget: "select", options: ["winner", "loser"] }
          - label: "Resultado"
            name: "score"
            widget: "object"
            required: false
            fields:
              - { label: "Local", name: "home", widget: "number", value_type: "int", min: 0 }
              - { label: "Visitante", name: "away", widget: "number", value_type: "int", min: 0 }
          - { label: "Mejor de", name: "bestOf", widget: "number", value_type: "int", min: 1, step: 2, required: false }
          - { label: "Bracket", name: "bracket", widget: "select", options: ["upper", "lower", "final"] }
          - { label: "Ronda", name: "round", widget: "number", value_type: "int", min: 1 }
          - { label: "Posición", name: "slot", widget: "number", value_type: "int", min: 1 }
      - { label: "ID interno", name: "id", widget: "hidden" }
