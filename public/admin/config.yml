backend:
  name: github
  repo: leo10m2010/nexus-page
  branch: main
  base_url: https://nexusseries.org
  auth_endpoint: api/auth

local_backend: true

publish_mode: simple

logo_url: "/logos/white.svg"
site_url: "https://nexusseries.org"
display_url: "https://nexusseries.org"

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "es"

collections:
  - name: "equipos"
    label: "Equipos"
    label_singular: "Equipo"
    folder: "src/data/teams"
    extension: "yaml"
    format: "yaml"
    create: true
    delete: true
    slug: "{{fields.id}}"
    identifier_field: "name"
    summary: "{{name}} ({{tag}})"
    sortable_fields: ["name"]
    fields:
      - label: "Nombre"
        name: "name"
        widget: "string"
      - label: "Tag (2 a 4 letras)"
        name: "tag"
        widget: "string"
        pattern: ["^.{2,4}$", "Entre 2 y 4 caracteres"]
      - label: "Región"
        name: "region"
        widget: "string"
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: false
        media_folder: "/public/teams"
        public_folder: "/teams"
        hint: "Imagen cuadrada, lo más chica posible."
      - label: "Jugadores"
        name: "players"
        widget: "list"
        required: false
        summary: "{{fields.handle}}"
        fields:
          - label: "Handle (nombre en juego)"
            name: "handle"
            widget: "string"
          - label: "Nombre real"
            name: "name"
            widget: "string"
            required: false
          - label: "Rol"
            name: "role"
            widget: "string"
            required: false
          - label: "País"
            name: "country"
            widget: "select"
            required: false
