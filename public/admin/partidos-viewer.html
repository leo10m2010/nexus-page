<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Partidos — Panel de administración</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter+Tight:wght@400;500;600&display=swap" />
<style>
  :root {
    --c-bg: #06080f;
    --c-bg-elev: #0b1020;
    --c-bg-elev-2: #101830;
    --c-line: rgb(238 237 238 / 0.10);
    --c-line-strong: rgb(238 237 238 / 0.20);
    --c-text: #eeedee;
    --c-text-muted: #9aa3b8;
    --c-accent: #ae7c32;
    --c-accent-lift: #d2a355;
    --font-display: "Archivo", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--c-bg);
    color: var(--c-text);
    font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    padding: 1.5rem;
  }
  .back-link {
    color: var(--c-text-muted);
    text-decoration: underline;
    font-size: 0.875rem;
  }
  .back-link:hover { color: var(--c-text); }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.75rem, 3.4vw, 2.75rem);
    margin: 1rem 0 0.5rem;
    text-transform: uppercase;
  }
  .hint {
    color: var(--c-text-muted);
    font-size: 0.875rem;
    margin: 0 0 2rem;
  }
  .status { color: var(--c-text-muted); font-size: 0.9375rem; }
  .status.error { color: #f87171; }

  .list {
    display: flex;
    flex-direction: column;
    gap: 0.875rem;
    max-width: 640px;
  }

  .match-card {
    display: flex;
    align-items: center;
    gap: 1.125rem;
    padding: 1rem 1.25rem;
    border: 1px solid var(--c-line-strong);
    border-radius: 0.875rem;
    background: linear-gradient(155deg, var(--c-bg-elev-2) 0%, var(--c-bg-elev) 60%);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease;
  }
  .match-card:hover { border-color: var(--c-accent); }

  .marks { position: relative; width: 76px; height: 48px; flex-shrink: 0; }
  .mark {
    position: absolute;
    top: 2px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: var(--c-bg-elev-2);
    border: 2px solid var(--c-bg);
    object-fit: contain;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.8125rem;
    color: var(--c-text-muted);
  }
  .mark.home { left: 0; z-index: 1; }
  .mark.away { left: 32px; z-index: 0; }
  .vs-badge {
    position: absolute;
    left: 26px;
    bottom: -4px;
    z-index: 2;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #d0303a;
    color: #fff;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--c-bg);
  }

  .info { flex: 1; min-width: 0; }
  .title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.0625rem;
    line-height: 1.25;
    margin: 0 0 0.25rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .context {
    color: var(--c-text-muted);
    font-size: 0.8125rem;
    margin: 0 0 0.4375rem;
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 0.4375rem;
    font-size: 0.8125rem;
    font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.live { background: #ef4444; animation: pulse 1.4s ease-in-out infinite; }
  .dot.upcoming { background: var(--c-accent-lift); }
  .dot.finished { background: var(--c-text-muted); }
  .status-line.live { color: #f87171; }
  .status-line.upcoming { color: var(--c-accent-lift); }
  .status-line.finished { color: var(--c-text-muted); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .score {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.25rem;
    color: var(--c-accent-lift);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <a class="back-link" href="/admin/index.html#/collections/partidos">← Volver al panel</a>
  <h1>Partidos</h1>
  <p class="hint">Haz clic en cualquier partido para editarlo.</p>
  <div id="content"><p class="status">Cargando…</p></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>
    function h(tag, attrs, children) {
      var el = document.createElement(tag);
      for (var k in attrs || {}) {
        if (k === "className") el.className = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
      (children || []).forEach(function (c) {
        if (c == null) return;
        el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return el;
    }

    async function fetchYamlFolder(repo, branch, folder) {
      var res = await fetch("https://api.github.com/repos/" + repo + "/contents/" + folder + "?ref=" + branch);
      if (!res.ok) throw new Error("No se pudo listar " + folder + " (" + res.status + ")");
      var files = await res.json();
      return Promise.all(
        files
          .filter(function (f) { return f.name.endsWith(".yaml"); })
          .map(async function (f) {
            var raw = await fetch(f.download_url);
            return jsyaml.load(await raw.text());
          })
      );
    }

    function markNode(team, side) {
      if (team && team.logo) {
        return h("img", { className: "mark " + side, src: team.logo, alt: "" });
      }
      var initial = team ? team.tag.charAt(0) : "?";
      var node = h("div", { className: "mark " + side }, [initial]);
      return node;
    }

    function relativeTime(ms) {
      var abs = Math.abs(ms);
      var minutes = Math.round(abs / 60000);
      if (minutes < 60) return minutes + " min";
      var hours = Math.floor(minutes / 60);
      var rem = minutes % 60;
      if (hours < 24) return hours + " h " + rem + " min";
      var days = Math.floor(hours / 24);
      return days + " d " + (hours % 24) + " h";
    }

    function statusInfo(match) {
      if (match.score) {
        return {
          cls: "finished",
          label: "Finalizado",
          score: match.score[0] + " – " + match.score[1],
        };
      }
      var start = new Date(match.startsAt).getTime();
      var now = Date.now();
      if (now >= start) {
        return { cls: "live", label: "En vivo" };
      }
      return { cls: "upcoming", label: "Comienza en " + relativeTime(start - now) };
    }

    function matchCard(match, teamById, tournamentById) {
      var home = match.home ? teamById[match.home] : null;
      var away = match.away ? teamById[match.away] : null;
      var st = statusInfo(match);
      var tournament = tournamentById[match.tournament];

      var marks = h("div", { className: "marks" }, [
        markNode(home, "home"),
        markNode(away, "away"),
        h("div", { className: "vs-badge" }, ["VS"]),
      ]);

      var title = h("p", { className: "title" }, [
        (home ? home.name : "Por definir") + " vs " + (away ? away.name : "Por definir"),
      ]);

      var context = h("p", { className: "context" }, [
        (tournament ? tournament.name : match.tournament) + (match.group ? " · Grupo " + match.group : ""),
      ]);

      var statusLine = h("p", { className: "status-line " + st.cls }, [
        h("span", { className: "dot " + st.cls }),
        st.label,
      ]);

      var card = h("a", { className: "match-card", href: "/admin/index.html#/collections/partidos/entries/" + match.id }, [
        marks,
        h("div", { className: "info" }, [title, context, statusLine]),
        st.score ? h("span", { className: "score" }, [st.score]) : null,
      ]);
      return card;
    }

    (async function init() {
      var content = document.getElementById("content");
      try {
        var configRes = await fetch("/admin/config.yml");
        var config = jsyaml.load(await configRes.text());
        var repo = config.backend.repo;
        var branch = config.backend.branch || "main";

        var teamDocs = await fetchYamlFolder(repo, branch, "src/data/teams");
        var matchDocs = await fetchYamlFolder(repo, branch, "src/data/matches");
        var tournamentDocs = await fetchYamlFolder(repo, branch, "src/data/tournaments");

        var teamById = {};
        teamDocs.forEach(function (t) { teamById[t.id] = t; });
        var tournamentById = {};
        tournamentDocs.forEach(function (t) { tournamentById[t.id] = t; });

        var groupMatches = matchDocs
          .filter(function (m) { return m.phase === "groupStage"; })
          .sort(function (a, b) { return new Date(a.startsAt) - new Date(b.startsAt); });

        var list = h("div", { className: "list" }, []);
        groupMatches.forEach(function (m) { list.appendChild(matchCard(m, teamById, tournamentById)); });

        content.innerHTML = "";
        content.appendChild(list);

        setInterval(function () {
          content.innerHTML = "";
          var refreshed = h("div", { className: "list" }, []);
          groupMatches.forEach(function (m) { refreshed.appendChild(matchCard(m, teamById, tournamentById)); });
          content.appendChild(refreshed);
        }, 60000);
      } catch (err) {
        content.innerHTML = "";
        content.appendChild(h("p", { className: "status error" }, [
          "No se pudo cargar los partidos: " + err.message,
        ]));
      }
    })();
  </script>
</body>
</html>
