# PARTIDOS
#
# DATOS DE EJEMPLO. Reemplazalos por los reales antes de publicar.
#
# Un partido aparece en RESULTADOS en cuanto le pones "score", y en el
# CALENDARIO mientras no lo tenga. No hay que moverlo de sitio.
#
# CAMPOS OBLIGATORIOS
#   id          identificador interno, unico.
#   tournament  el id de un torneo de tournaments.yaml
#   stage       groupStage | lowerRound | quarterfinal | semifinal |
#               upperFinal | lowerFinal | final | grandFinal | thirdPlace
#               (se traduce solo a los tres idiomas)
#   startsAt    fecha y hora con zona horaria. La Z final significa UTC.
#               Ejemplo: 2026-09-12T18:00:00Z
#
# CAMPOS OPCIONALES
#   home / away el id de un equipo de teams.yaml. Si lo dejas sin poner,
#               el hueco sale como "Por definir": asi puedes publicar el
#               cuadro entero antes de saber quien lo llena.
#   score       [marcador_home, marcador_away]. BORRA esta linea entera
#               mientras el partido no se haya jugado.
#   bestOf      1, 3, 5... sale como Bo1 / Bo3 / Bo5.
#   bracket     upper | lower | final. Solo hace falta para dibujar el cuadro.
#               Un partido sin "bracket" no sale en el cuadro, pero si en la
#               lista de partidos.
#   round       la columna dentro de ese lado del cuadro. 1 = primera ronda.
#   group       letra del grupo: A, B... Los partidos con "group" alimentan
#               la tabla de clasificacion de esa fase.

# =====================================================================
# NEXUS SERIES I - datos reales.
# Fuente: https://liquipedia.net/dota2/NEXUS_SERIES/1 (horarios en PET,
# convertidos aqui a UTC restando 5 horas).
#
# Grupo A y B: modificado GSL, top 2 de cada uno pasan a playoffs.
# M1 y M2 de cada grupo ya tienen equipos; M3-M5 salen del resultado de esos
# dos primeros partidos y todavia no estan decididos.
# Playoffs: doble eliminacion a 4 equipos. Nadie ha clasificado aun.
# =====================================================================

