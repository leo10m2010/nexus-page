# PARTIDOS
#
# DATOS DE EJEMPLO. Reemplazalos por los reales antes de publicar.
#
# Un partido aparece en el CALENDARIO si no tiene "score",
# y en RESULTADOS en cuanto se lo pones. No hay que moverlo de sitio.
#
# Campos:
#   id          identificador interno, unico.
#   tournament  el id de un torneo de tournaments.yaml
#   stage       groupStage | quarterfinal | semifinal | final | thirdPlace
#               (se traduce solo a los tres idiomas)
#   startsAt    fecha y hora con zona horaria. La Z final significa UTC.
#               Ejemplo: 2026-09-12T18:00:00Z
#               La web muestra la hora local de cada visitante.
#   home / away el id de un equipo de teams.yaml
#   score       [marcador_home, marcador_away]. BORRA esta linea entera
#               mientras el partido no se haya jugado.

