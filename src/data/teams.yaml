# EQUIPOS
#
# DATOS DE EJEMPLO. Todos los equipos de abajo son inventados para poder ver
# la pagina montada. Reemplazalos por los reales antes de publicar.
#
# Campos:
#   id      identificador interno, en minusculas y sin espacios.
#           Es lo que escribes en matches.yaml para referirte al equipo.
#   name    nombre visible.
#   tag     abreviatura de 2 a 4 letras. Sale en el monograma y en los marcadores.
#   region  texto libre: LATAM, EU, NA, CIS, SEA...
#   logo    opcional. Ruta dentro de public/, por ejemplo /teams/aurora.svg
#           Si no lo pones, se dibuja el icono de Dota 2 en tono neutro,
#           en vez del logo del equipo.
#   players opcional. La plantilla, tal como sale en la ficha del torneo.
#           Cada jugador lleva:
#             handle   el nick. Es lo unico obligatorio.
#             name     nombre real, opcional.
#             role     texto libre: Capitan, Coach, Suplente...
#             country  codigo de dos letras, opcional. Se muestra en mayusculas.
#           Un equipo sin "players" sale igual, solo que sin plantilla.

# =====================================================================
# NEXUS SERIES I - equipos reales, tal como estan invitados al torneo.
# Fuente: https://liquipedia.net/dota2/NEXUS_SERIES/1
# =====================================================================

